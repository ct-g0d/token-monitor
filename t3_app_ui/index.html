<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Token Monitor</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('tokenmonitor:theme') || localStorage.getItem('t3code:theme') || localStorage.getItem('t3code:theme-appearance-mode') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var lang = localStorage.getItem('tokenmonitor:locale') || localStorage.getItem('t3code:locale');
          if (lang) {
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('data-locale', lang);
          }
          var regLocale = localStorage.getItem('tokenmonitor:regional-locale') || localStorage.getItem('t3code:regional-locale');
          if (regLocale) {
            document.documentElement.setAttribute('data-regional-locale', regLocale);
          }
          var DEFAULT_INTERFACE_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          var stored = localStorage.getItem('tokenmonitor:font-family') || localStorage.getItem('t3code:font-family');
          if (stored === 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' && !localStorage.getItem('tokenmonitor:explicit-mono')) {
            stored = '';
          }
          var font = stored || DEFAULT_INTERFACE_FONT;
          if (font) {
            document.documentElement.style.setProperty('--font-sans', font);
            document.documentElement.style.setProperty('--ui-font', font);
            document.documentElement.style.setProperty('--display-font', font);
            document.documentElement.style.setProperty('--tm-display', 'Bahnschrift, "DIN Alternate", "DIN Condensed", var(--font-sans)');
            if (stored && (stored.includes('monospace') || stored.includes('SFMono') || stored.includes('Liberation Mono') || stored.includes('ui-monospace'))) {
              document.documentElement.style.setProperty('--font-mono', font);
            }
          }
          var textSize = localStorage.getItem('tokenmonitor:text-size');
          if (textSize) {
            var scale = textSize === 'largest' ? 1.2 : (textSize === 'larger' ? 1.1 : 1.0);
            document.documentElement.dataset.textSize = textSize;
            document.documentElement.style.setProperty('--ui-text-scale', String(scale));
            if (scale !== 1.0) {
              document.documentElement.style.fontSize = Math.round(scale * 100) + '%';
            }
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
