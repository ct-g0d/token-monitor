<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Token Monitor</title>
    <script>
      (function() {
        try {
          var DEFAULT_INTERFACE_FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
          var font = localStorage.getItem('tokenmonitor:font-family') || localStorage.getItem('t3code:font-family') || DEFAULT_INTERFACE_FONT;
          if (font) {
            document.documentElement.style.setProperty('--font-sans', font);
            document.documentElement.style.setProperty('--ui-font', font);
            document.documentElement.style.setProperty('--display-font', font);
            document.documentElement.style.setProperty('--tm-display', font + ', var(--font-sans)');
            if (font === DEFAULT_INTERFACE_FONT || font.includes('monospace') || font.includes('SFMono') || font.includes('Liberation Mono') || font.includes('ui-monospace')) {
              document.documentElement.style.setProperty('--font-mono', font);
            }
          }
          var textSize = localStorage.getItem('tokenmonitor:text-size');
          if (textSize) {
            var scale = textSize === 'largest' ? 1.2 : (textSize === 'larger' ? 1.1 : 1.0);
            document.documentElement.dataset.textSize = textSize;
            document.documentElement.style.setProperty('--ui-text-scale', String(scale));
            if (scale !== 1.0) {
              document.documentElement.style.fontSize = Math.round(scale * 100) + '%';
            }
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: var(--font-sans, ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace);
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
